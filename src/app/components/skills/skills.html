<section id="skills" class="section-wrap">
  <div class="container">

    <div class="section-header">
      <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
      </svg>
      <h2 class="section-title">Skills</h2>
    </div>

    <div class="skills-grid">
      <div class="skill-group" *ngFor="let group of skillGroups">
        <h3 class="skill-group-label">{{ group.category }}</h3>
        <div class="skill-tags">
          <span
            class="skill-tag"
            [class.skill-tag--icon]="skill.icon"
            *ngFor="let skill of group.skills"
          >
            <span
              *ngIf="skill.icon"
              class="skill-tag-icon"
              [innerHTML]="icons[skill.icon]"
            ></span>
            {{ skill.name }}
          </span>
        </div>
      </div>
    </div>

  </div>
</section>
