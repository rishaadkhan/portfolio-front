<section id="projects" class="section-wrap">
  <div class="container">

    <div class="section-header">
      <!-- code icon -->
      <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
      </svg>
      <h2 class="section-title">Projects</h2>
    </div>

    <div class="projects-grid">
      <div
        *ngFor="let project of projects"
        class="project-card"
        data-aos="fade-up"
        [attr.data-aos-delay]="project.delay"
      >
        <div class="project-body">
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-desc">{{ project.description }}</p>
          <div class="project-tags">
            <span *ngFor="let tech of project.technologies">{{ tech }}</span>
          </div>
        </div>
        <div class="project-footer">
          <a [href]="project.projectUrl" class="project-link">
            View Project
            <svg class="project-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>
        </div>
      </div>
    </div>

  </div>
</section>
