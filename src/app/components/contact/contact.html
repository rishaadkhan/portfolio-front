<section id="contact" class="section-wrap">
  <div class="container">

    <div class="section-header">
      <!-- mail icon -->
      <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
      </svg>
      <h2 class="section-title">Contact</h2>
    </div>

    <p class="section-sub">Open to senior backend, full-stack, and cloud engineering roles.</p>

    <div class="contact-layout">
      <form class="contact-form" (submit)="onSubmit($event)" novalidate>
        <p class="form-success" [hidden]="!successMessage">{{ successMessage }}</p>
        <p class="form-error"   [hidden]="!errorMessage">{{ errorMessage }}</p>

        <div class="form-field">
          <label>Name</label>
          <input name="name" required type="text" placeholder="Your name" />
          <p class="field-error" [hidden]="!fieldErrors['name']">{{ fieldErrors['name'] }}</p>
        </div>

        <div class="form-field">
          <label>Email</label>
          <input name="email" required type="email" placeholder="your@email.com" />
          <p class="field-error" [hidden]="!fieldErrors['email']">{{ fieldErrors['email'] }}</p>
        </div>

        <div class="form-field">
          <label>Message</label>
          <textarea name="message" required placeholder="Your message" rows="5"></textarea>
          <p class="field-error" [hidden]="!fieldErrors['message']">{{ fieldErrors['message'] }}</p>
        </div>

        <button type="submit" class="btn-submit" [disabled]="isLoading">
          <span [hidden]="isLoading">Send Message</span>
          <span [hidden]="!isLoading" class="btn-loading">
            <svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" opacity="0.25"/><path d="M12 2a10 10 0 0110 10" stroke-linecap="round"/></svg>
            Sending…
          </span>
        </button>
      </form>

      <div class="contact-info">
        <p class="contact-info-label">Direct contact</p>

        <div class="contact-row">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
          </svg>
          <span>rishaad326&#64;gmail.com</span>
        </div>
        <div class="contact-row">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 .84h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.23-1.23a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16z"/>
          </svg>
          <span>+91 8932988918</span>
        </div>
        <div class="contact-row">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
          </svg>
          <span>Lucknow, UP</span>
        </div>

        <div class="contact-divider"></div>

        <div class="contact-links">
          <a href="https://www.linkedin.com/in/rishaad-khan-one" target="_blank" rel="noopener" class="contact-link">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2zm2-4.5a2.5 2.5 0 110 5 2.5 2.5 0 010-5z"/></svg>
            LinkedIn
          </a>
          <a href="https://github.com/rishaadkhan" target="_blank" rel="noopener" class="contact-link">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
            GitHub
          </a>
          <a href="https://codolio.com/profile/rishaadkhan" target="_blank" rel="noopener" class="contact-link">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
            </svg>
            Codolio

        </div>
      </div>
    </div>

  </div>
</section>
